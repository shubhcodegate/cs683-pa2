<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
  <title id="title">Task 1B SPP results across three traces</title>
  <desc id="desc">Five horizontal bar charts compare baseline and SPP IPC and L1D load MPKI, and show speedup, prefetch accuracy, and MPKI-reduction coverage for Trace1 through Trace3.</desc>
  <rect width="1200" height="1040" fill="#f3f6f5"/>
  <text x="40" y="48" fill="#18333b" font-family="sans-serif" font-size="27" font-weight="700">Task 1B / SPP 1.0</text>
  <text x="40" y="76" fill="#5a6a70" font-family="sans-serif" font-size="15">25M warmup + 25M ROI instructions per run · baseline versus SPP</text>

