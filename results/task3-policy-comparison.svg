<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
  <title id="title">Task 3 comparison with standalone policies</title>
  <desc id="desc">Grouped horizontal bars compare baseline, SPP-only, dynamic-I-RRIP-only, and combined Task 3 speedup and L1D and L2C load MPKI reduction for three traces.</desc>
