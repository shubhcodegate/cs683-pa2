      <text x="22" y="211" fill="#344a50" font-size="14">Trace3</text><rect x="110" y="187" width="255" height="11" fill="#89969b"/><text x="371" y="197" fill="#596d70" font-size="12">0.382065</text><rect x="110" y="204" width="259" height="11" fill="#138779"/><text x="375" y="214" fill="#138779" font-size="12">0.388157</text>
