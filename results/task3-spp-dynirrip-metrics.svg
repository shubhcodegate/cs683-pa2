<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1420" viewBox="0 0 1200 1420" role="img" aria-labelledby="title desc">
  <title id="title">Task 3 SPP and dynamic I-RRIP results</title>
  <desc id="desc">Paired charts compare Task 1A baseline against Task 3 on IPC, L1D load MPKI, total L2 load MPKI, L2 data load MPKI, and L2 instruction load MPKI. Additional charts show speedup, L1D prefetch accuracy, and L1D coverage.</desc>
  <rect width="1200" height="1420" fill="#f2f5f3"/>
  <text x="40" y="45" fill="#18343b" font-family="sans-serif" font-size="28" font-weight="700">Task 3 / SPP + dynamic I-RRIP</text>
  <text x="40" y="73" fill="#596d70" font-family="sans-serif" font-size="15">Task 1A no-prefetch baseline vs. combined Task 3 · 25M warmup + 25M ROI instructions</text>
